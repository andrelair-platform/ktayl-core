spring:
  application:
    name: ktayl-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ktayl_core}
    username: ${DATABASE_USER:ktayl_core}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate            # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        default_schema: billing
  flyway:
    enabled: true
    schemas: billing                # schema-per-module (billing first)
    default-schema: billing
    create-schemas: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Authentik OIDC issuer (resource-server validates tokens against its JWKS)
          issuer-uri: ${AUTHENTIK_ISSUER:https://auth.devandre.sbs/application/o/ktayl-core/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # METRICS: /actuator/prometheus, scraped by the platform Prometheus
  endpoint:
    health:
      probes:
        enabled: true               # /actuator/health/liveness + /readiness for k8s probes
  # TRACES (ADR-012): Micrometer Tracing → OTLP → the platform otelcol → Tempo. Endpoint + sampling are
  # env-overridable (dev defaults to sample-all + the in-cluster collector; prod lowers the rate).
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otelcol-opentelemetry-collector.observability.svc:4318/v1/traces}

# LOGS (ADR-012): structured JSON to stdout (the 12-factor event stream) → Promtail → Loki. Micrometer
# Tracing injects traceId/spanId into the MDC, so every log line is CORRELATED to its trace — this is
# what makes the triad cohesive (a log → its trace → its metrics). Local dev can override to plain text.
logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}

server:
  port: 8080

# Billing ingest (ADR-003): durable JetStream consumer of the UW bound-risk event.
# PROD sets billing.nats.url (authoritative consumer); dev leaves it BLANK → consumer disabled
# (exactly one env consumes the shared UNDERWRITING_EVENTS stream — the HR_LIFECYCLE discipline).
billing:
  nats:
    url: ${BILLING_NATS_URL:}
    stream: ${BILLING_NATS_STREAM:UNDERWRITING_EVENTS}
    subject: ${BILLING_NATS_SUBJECT:insurance.underwriting.bound-risk}
    durable: ${BILLING_NATS_DURABLE:billing-ingest}

# Complaints (CMPL-012): the acknowledgement-due PLACEHOLDER window (next-action SLA marker — deliberately
# NOT the ACPR/EIOPA/IDD statutory deadline). ISO-8601 duration; acknowledge() sets due = now + this.
complaints:
  acknowledgement-window: ${COMPLAINTS_ACK_WINDOW:P2D}
