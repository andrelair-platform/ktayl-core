spring:
  application:
    name: ktayl-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ktayl_core}
    username: ${DATABASE_USER:ktayl_core}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate            # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        default_schema: billing
  flyway:
    enabled: true
    schemas: billing                # schema-per-module (billing first)
    default-schema: billing
    create-schemas: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate by SIGNATURE against the shared Authentik JWKS (every provider here signs with the same
          # key), then check iss against an ALLOWLIST (ktayl.security.trusted-issuers below). Replaces strict
          # issuer-uri, which rejected M2M tokens minted by a different provider (ADR-016). Lazy: no eager
          # discovery at startup. Split-horizon host → 10.0.0.200; the minicloud CA is baked into the image.
          jwk-set-uri: ${AUTHENTIK_JWKS_URI:https://auth.devandre.sbs/application/o/ktayl-core/jwks/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # METRICS: /actuator/prometheus, scraped by the platform Prometheus
  endpoint:
    health:
      probes:
        enabled: true               # /actuator/health/liveness + /readiness for k8s probes
  # TRACES (ADR-012): Micrometer Tracing → OTLP → the platform otelcol → Tempo. Endpoint + sampling are
  # env-overridable (dev defaults to sample-all + the in-cluster collector; prod lowers the rate).
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otelcol-opentelemetry-collector.observability.svc:4318/v1/traces}

# LOGS (ADR-012): structured JSON to stdout (the 12-factor event stream) → Promtail → Loki. Micrometer
# Tracing injects traceId/spanId into the MDC, so every log line is CORRELATED to its trace — this is
# what makes the triad cohesive (a log → its trace → its metrics). Local dev can override to plain text.
logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}

server:
  port: 8080

# Multi-issuer allowlist (ADR-016): the EXACT iss strings ktayl-core trusts, comma-separated. Includes
# ktayl-core's own (human SSO, external host) + each M2M consumer's issuer (internal-host form, trailing
# slash — what an in-cluster client-credentials token carries). A new M2M consumer = add its iss to
# AUTHENTIK_TRUSTED_ISSUERS (no code change). Defaults cover dev: ktayl-core SSO + underwriting's bind client.
# NB: the internal-host issuer has NO `:80` — Authentik stamps `iss` from the request Host and drops the
# default port, so the token's iss is `…authentik.svc/application/o/<app>/`. A `:80` here fails the exact
# match → 401 (this silently broke underwriting→ktayl-core-prod binding until 2026-11-17, found by the
# live prod bind-gate test; the prod values override is now redundant with this corrected default).
ktayl:
  security:
    trusted-issuers: ${AUTHENTIK_TRUSTED_ISSUERS:https://auth.devandre.sbs/application/o/ktayl-core/,http://authentik-server.authentik.svc/application/o/ktayl-underwriting/}

# Billing ingest (ADR-003): durable JetStream consumer of the UW bound-risk event.
# PROD sets billing.nats.url (authoritative consumer); dev leaves it BLANK → consumer disabled
# (exactly one env consumes the shared UNDERWRITING_EVENTS stream — the HR_LIFECYCLE discipline).
billing:
  nats:
    url: ${BILLING_NATS_URL:}
    stream: ${BILLING_NATS_STREAM:UNDERWRITING_EVENTS}
    subject: ${BILLING_NATS_SUBJECT:insurance.underwriting.bound-risk}
    durable: ${BILLING_NATS_DURABLE:billing-ingest}
  # Stripe PSP (ADR-002, test mode, SEPA Direct Debit). BLANK by default → no gateway bean, so payment
  # initiation returns 503 and the webhook returns 503 until the signing secret is set. Keys come from
  # ESO→Vault (secret/platform/ktayl-core*): BILLING_STRIPE_SECRET_KEY, BILLING_STRIPE_WEBHOOK_SECRET.
  stripe:
    secret-key: ${BILLING_STRIPE_SECRET_KEY:}
    webhook-secret: ${BILLING_STRIPE_WEBHOOK_SECRET:}
  # Dunning (BILL-013c): after this many failed collection attempts the dunning case becomes lapse_pending
  # and a PolicyLapseRecommended event is raised (a recommendation for human review, not an auto-lapse).
  dunning:
    lapse-threshold: ${BILLING_DUNNING_LAPSE_THRESHOLD:3}
  # Commission schedule (BILL-012b): the broker/intermediary cut of the GROSS premium, in basis points
  # (1500 = 15%). Policyholder is still billed gross; the split only drives the GL (net income vs commission
  # payable). A commission schedule is a billing/distribution concern → applied here, no UW change.
  commission:
    default-bps: ${BILLING_COMMISSION_DEFAULT_BPS:1500}
    # Per-product overrides keyed by product_code (basis points), set via env/overlay, e.g.
    #   BILLING_COMMISSION_RATES_MARINE=1000 → billing.commission.rates.MARINE=1000. Empty by default.
    rates: {}

# GL posting to ERPNext (ADR-002, BILL-014 — transactional outbox). BLANK api-key by default → no ledger
# client bean, so the outbox accumulates and the drainer no-ops until ERPNext creds are set (ESO→Vault
# secret/platform/erpnext: LEDGER_ERPNEXT_API_KEY, LEDGER_ERPNEXT_API_SECRET). Account names + company map
# to the ERPNext chart of accounts via config, so no code change to align them.
ledger:
  drain-interval-ms: ${LEDGER_DRAIN_INTERVAL_MS:30000}
  drain-initial-ms: ${LEDGER_DRAIN_INITIAL_MS:20000}
  erpnext:
    base-url: ${LEDGER_ERPNEXT_BASE_URL:http://erpnext.erp.svc:8080}
    api-key: ${LEDGER_ERPNEXT_API_KEY:}
    api-secret: ${LEDGER_ERPNEXT_API_SECRET:}
    company: ${LEDGER_ERPNEXT_COMPANY:ktayl-solution}
    accounts:
      premium-receivable: ${LEDGER_ACC_PREMIUM_RECEIVABLE:Premium Receivable}
      premium-income: ${LEDGER_ACC_PREMIUM_INCOME:Premium Income}
      commission-payable: ${LEDGER_ACC_COMMISSION_PAYABLE:Commission Payable}
      cash: ${LEDGER_ACC_CASH:Cash}
    # ERPNext requires a Party on a Receivable account — attach it to this account (the receivable) only.
    party-account: ${LEDGER_ERPNEXT_PARTY_ACCOUNT:}
    party-type: ${LEDGER_ERPNEXT_PARTY_TYPE:Customer}
    party: ${LEDGER_ERPNEXT_PARTY:}

# Claims GL seam (ADR-021, CLM-FIN-01). The claims-GL ingest consumer is ACTIVE only when claims.nats.url is
# set (PROD = the single authoritative consumer; dev blank → disabled, same no-double-post discipline as
# billing). It consumes insurance.claims.financial (a reserve movement or a loss payment) from the
# CLAIMS_EVENTS JetStream stream → a transactional outbox → ERPNext JE (reusing the ledger.erpnext.* creds +
# the ledger.drain-* cadence above). Claims GL account names map to the French-PCG CoA via config.
claims:
  nats:
    url: ${CLAIMS_NATS_URL:}
    stream: ${CLAIMS_NATS_STREAM:CLAIMS_EVENTS}
    subject: ${CLAIMS_NATS_SUBJECT:insurance.claims.financial}
    durable: ${CLAIMS_NATS_DURABLE:claimsgl-ingest}
  ledger:
    accounts:
      incurred: ${CLAIMS_ACC_INCURRED:Claims Incurred}
      provision: ${CLAIMS_ACC_PROVISION:Outstanding Claims Provision}
      cash: ${CLAIMS_ACC_CASH:Cash}

# Complaints (CMPL-012): the acknowledgement-due PLACEHOLDER window (next-action SLA marker — deliberately
# NOT the ACPR/EIOPA/IDD statutory deadline). ISO-8601 duration; acknowledge() sets due = now + this.
complaints:
  acknowledgement-window: ${COMPLAINTS_ACK_WINDOW:P2D}

# Screening (RC-02, AML / sanctions, LCB-FT). The engine is yente over OpenSanctions sanctions lists
# (ktayl-compliance #15 ADOPT decision). base-url defaults to the in-cluster yente service; match-threshold
# is the minimum provider score (0..1) kept as a hit. An engine outage fails CLOSED → HOLD (never ALLOW).
screening:
  yente:
    base-url: ${SCREENING_YENTE_BASE_URL:http://yente.yente.svc:8000}
  match-threshold: ${SCREENING_MATCH_THRESHOLD:0.70}

# Underwriting handoff (SUB-02): route() hands a ROUTED submission off to the underwriting (#12) service,
# creating a real UW submission from the exposure dossier. base-url defaults to the in-cluster underwriting
# service. DEV: underwriting's API auth is OFF + no client-id below → the handoff calls UNAUTHENTICATED.
# PROD (SUB-02 prod increment): underwriting's API auth is ON. Setting the oauth2 client-id/secret/token-uri
# (from the ESO→Vault secret) turns on the OAuth2 client-credentials bearer: the UnderwritingTokenProvider
# mints a token scoped `underwriting:write` and the adapter attaches it. The M2M pattern mirrors
# underwriting→ktayl-core (ADR-016): a client-credentials grant against Authentik's token endpoint.
underwriting:
  # The underwriting FastAPI backend Service is `ktayl-underwriting` (NOT `underwriting`), port 80 → pod 8000.
  # Dev default below; prod overrides UNDERWRITING_BASE_URL → ktayl-underwriting.underwriting-prod.svc:80.
  base-url: ${UNDERWRITING_BASE_URL:http://ktayl-underwriting.underwriting.svc:80}
  oauth2:
    # All blank by default → DEV unauthenticated. Prod sets these from the ESO→Vault secret/platform/ktayl-core.
    # token-uri = Authentik's OAuth2 token endpoint; client-id non-blank is what ENABLES the token provider.
    token-uri:     ${UNDERWRITING_OAUTH_TOKEN_URI:}
    client-id:     ${UNDERWRITING_OAUTH_CLIENT_ID:}
    client-secret: ${UNDERWRITING_OAUTH_CLIENT_SECRET:}
    scope:         ${UNDERWRITING_OAUTH_SCOPE:underwriting:write}
