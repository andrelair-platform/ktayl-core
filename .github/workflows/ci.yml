name: CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml', 'Dockerfile', '.github/workflows/ci.yml', '.tbls.yml', '.trivyignore', 'docs/data-model/**']
  # PR trigger is intentionally NOT path-filtered: a workflow skipped by a path filter leaves its
  # required checks "Expected" forever and deadlocks the PR (GitHub docs). The workflow always runs
  # on PRs to main; a job-level `changes` filter skips the heavy jobs on a docs-only PR; the always-
  # run `CI Success` aggregate is the single required status check. (ruleset main-protection)
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: harbor.10.0.0.200.nip.io          # dev images
  GHCR_ORG: ghcr.io/andrelair-platform           # prod images (public, durable, off local disk)
  IMAGE: ktayl-core

jobs:
  # Detect whether real code (not just docs/bmad) changed, so the heavy jobs skip on a docs-only PR
  # while the workflow still runs and reports (see the `on:` note + CI Success below).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'pom.xml'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
              - '.tbls.yml'
              - '.trivyignore'
              - 'docs/data-model/**'

  # ── L0/L1 gate (runs when code changed): compile + unit + the module-boundary verification ──
  build-test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build + test (incl. ModularityTests ApplicationModules.verify)
        run: mvn -B -ntp verify

  # ── Schema docs: CI OWNS the ERD (generate-and-commit, self-healing) ──────────────────────────────
  # The committed ERD is reverse-engineered from the Flyway migrations (applied to an EPHEMERAL Postgres —
  # no live-cluster access) by the digest-pinned tbls, on the canonical x86_64 runner. Rather than FAIL a
  # PR on drift (which forced a contributor to hand-run tbls with local Docker + arch-matching — see
  # docs/data-model/README.md), CI regenerates and commits the result back to the PR branch. "Docs can't
  # lie" — and now they can't go stale either. NO manual regeneration, ever.
  #   ⚠️ PRs MUST be squash-merged: main requires signed commits; the squash commit is GitHub-signed, so
  #      the unsigned CI auto-commit on the PR branch never lands on main. (A plain merge would carry it.)
  schema-erd:
    name: Schema ERD (auto-generate)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the regenerated ERD back to the PR branch
    services:
      postgres:
        image: postgres:17.4   # PINNED — tbls embeds database_version (incl. arch) in the doc; a floating tag drifts
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: ktayl_core
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGPASSWORD: pw
      TBLS_DSN: "postgres://postgres:pw@localhost:5432/ktayl_core?sslmode=disable&search_path=billing"
      # DIGEST-PINNED tbls (NOT setup-tbls, whose older defaults false-drift). The exact tbls that made the baseline.
      TBLS_IMAGE: ghcr.io/k1low/tbls@sha256:0d90f07aed0c423a6012d542358c10b13fcdf15a1074ceee3d73676c87cc2f79
    steps:
      - uses: actions/checkout@v4
        with:
          # On a PR check out the HEAD branch TIP (not the detached merge ref) so we can push back;
          # on push to main, github.head_ref is empty → fall back to the pushed ref.
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          # Push the auto-commit with a PAT (NOT the default GITHUB_TOKEN): a GITHUB_TOKEN push does not
          # re-trigger workflows, so the required `CI Success` check would be stuck "Expected" on the new
          # head SHA. The PAT push re-runs CI on the new head → the required check resolves. The re-run is
          # idempotent (deterministic regen → no further drift → no further commit), so it terminates.
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Apply Flyway migrations to the ephemeral DB (billing schema)
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql -h localhost -U postgres -d ktayl_core -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS billing; ALTER DATABASE ktayl_core SET search_path TO billing;"
          for f in $(ls src/main/resources/db/migration/V*.sql | sort); do
            echo "applying $(basename "$f")"
            psql -h localhost -U postgres -d ktayl_core -v ON_ERROR_STOP=1 -c "SET search_path TO billing;" -f "$f"
          done
      - name: Regenerate the ERD from the migrations (tbls doc applies .tbls.yml — mermaid/sort/adjust)
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work \
            "$TBLS_IMAGE" doc -t mermaid --sort -j "$TBLS_DSN" docs/data-model --force
      - name: Commit the regenerated ERD back to the PR branch (self-healing)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- docs/data-model; then
            echo "✅ ERD already in sync with the migrations — nothing to commit"; exit 0
          fi
          # Loop guard: if the branch tip is already a bot ERD-regen commit, don't stack another (bounds
          # any re-trigger to a single auto-commit per human push, even if regen were ever non-deterministic).
          if [ "$(git log -1 --pretty=%s)" = "chore(erd): regenerate data-model from migrations" ]; then
            echo "tip is already an auto-ERD commit — not committing again (loop guard)"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data-model
          git commit -m "chore(erd): regenerate data-model from migrations"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "::notice::ERD was stale — regenerated and committed to the PR branch. Squash-merge to keep main signed."
      - name: Verify sync on push to main (canary — warns, never blocks an already-merged change)
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- docs/data-model; then
            echo "✅ ERD in sync on main"
          else
            echo "::warning::ERD drift on main — a PR was likely NOT squash-merged after CI regenerated it."
          fi

  # ── Build · scan · sign · SBOM (main only) ──────────────────────────────────
  build-and-push:
    needs: [build-test]
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # cosign keyless (OIDC)
      packages: write        # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Compute tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          HARBOR_REF="${REGISTRY}/library/${IMAGE}:${SHA}"
          GHCR_REF="${GHCR_ORG}/${IMAGE}:${SHA}"
          { echo "tags<<EOF"; echo "${HARBOR_REF}"; echo "${GHCR_REF}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "ghcr_ref=${GHCR_REF}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA (for the Harbor registry push)
        run: |
          sudo mkdir -p /etc/docker/certs.d/${REGISTRY}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${REGISTRY}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      # ktayl-core does NOT bake the minicloud CA: it calls PAS/ERPNext over in-cluster HTTP and
      # Stripe over public TLS (standard CA in the JRE truststore). So no CA build-arg/secret here.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan (Trivy, CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.ghcr_ref }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign (keyless) + attach SBOM  [ghcr prod image]
        run: |
          cosign sign --yes ${GHCR_ORG}/${IMAGE}@${{ steps.build.outputs.digest }}
          syft ${{ steps.meta.outputs.ghcr_ref }} -o cyclonedx-json=sbom.json
          cosign attest --yes --predicate sbom.json --type cyclonedx \
            ${GHCR_ORG}/${IMAGE}@${{ steps.build.outputs.digest }}

  # ── Single required status check for the `main-protection` ruleset ──────────
  # if: always() → ALWAYS runs on every PR to main (always reports; no path/skip deadlock). Fails if
  # change-detection failed or a heavy job genuinely failed; a SKIPPED heavy job (docs-only PR) = pass.
  ci-success:
    name: CI Success
    needs: [changes, build-test, schema-erd]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build-test.result }}
          ERD_RESULT: ${{ needs.schema-erd.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed (result=$CHANGES_RESULT)"; exit 1
          fi
          fail=0
          for name in BUILD ERD; do
            var="${name}_RESULT"; r="${!var}"
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "$name job did not pass (result=$r)"; fail=1
            fi
          done
          if [[ $fail -eq 0 ]]; then
            echo "All CI checks passed (heavy jobs skipped = no code change)."
          else
            exit 1
          fi
