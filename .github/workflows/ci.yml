name: CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml', 'Dockerfile', '.github/workflows/ci.yml', '.tbls.yml', 'docs/data-model/**']
  pull_request:
    paths: ['src/**', 'pom.xml', 'Dockerfile', '.github/workflows/ci.yml', '.tbls.yml', 'docs/data-model/**']

permissions:
  contents: read

env:
  REGISTRY: harbor.10.0.0.200.nip.io          # dev images
  GHCR_ORG: ghcr.io/andrelair-platform           # prod images (public, durable, off local disk)
  IMAGE: ktayl-core

jobs:
  # ── L0/L1 gate (every push/PR): compile + unit + the module-boundary verification ──
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build + test (incl. ModularityTests ApplicationModules.verify)
        run: mvn -B -ntp verify

  # ── Schema docs drift-check (every push/PR): the committed ERD must match the Flyway migrations ──
  # Reverse-engineers the schema from the migrations (applied to an EPHEMERAL Postgres — no live-cluster
  # access) with tbls, and fails if docs/data-model/ is stale. "Docs can't lie." Regenerate with:
  #   tbls doc "<dsn>" docs/data-model --force   (see .tbls.yml / developer-platform/schema-erd-autogenerated)
  schema-erd-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4   # PINNED — tbls embeds database_version in the doc; a floating tag drifts
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: ktayl_core
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGPASSWORD: pw
      TBLS_DSN: "postgres://postgres:pw@localhost:5432/ktayl_core?sslmode=disable&search_path=billing"
    steps:
      - uses: actions/checkout@v4
      - name: Apply Flyway migrations to the ephemeral DB (billing schema)
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql -h localhost -U postgres -d ktayl_core -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS billing; ALTER DATABASE ktayl_core SET search_path TO billing;"
          for f in $(ls src/main/resources/db/migration/V*.sql | sort); do
            echo "applying $(basename "$f")"
            psql -h localhost -U postgres -d ktayl_core -v ON_ERROR_STOP=1 -c "SET search_path TO billing;" -f "$f"
          done
      - uses: k1LoW/setup-tbls@v1
      - name: ERD drift-check
        run: |
          set +e
          tbls diff "$TBLS_DSN" docs/data-model | tee /tmp/erd.diff
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] || [ -s /tmp/erd.diff ]; then
            echo "::error::docs/data-model drifted from the migrations (or tbls errored, rc=$rc). Regenerate: tbls doc \"\$TBLS_DSN\" docs/data-model --force"
            exit 1
          fi
          echo "✅ ERD docs are in sync with the migrations"

  # ── Build · scan · sign · SBOM (main only) ──────────────────────────────────
  build-and-push:
    needs: [build-test]
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # cosign keyless (OIDC)
      packages: write        # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Compute tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          HARBOR_REF="${REGISTRY}/library/${IMAGE}:${SHA}"
          GHCR_REF="${GHCR_ORG}/${IMAGE}:${SHA}"
          { echo "tags<<EOF"; echo "${HARBOR_REF}"; echo "${GHCR_REF}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "ghcr_ref=${GHCR_REF}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA (for the Harbor registry push)
        run: |
          sudo mkdir -p /etc/docker/certs.d/${REGISTRY}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${REGISTRY}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      # ktayl-core does NOT bake the minicloud CA: it calls PAS/ERPNext over in-cluster HTTP and
      # Stripe over public TLS (standard CA in the JRE truststore). So no CA build-arg/secret here.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan (Trivy, CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.ghcr_ref }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign (keyless) + attach SBOM  [ghcr prod image]
        run: |
          cosign sign --yes ${GHCR_ORG}/${IMAGE}@${{ steps.build.outputs.digest }}
          syft ${{ steps.meta.outputs.ghcr_ref }} -o cyclonedx-json=sbom.json
          cosign attest --yes --predicate sbom.json --type cyclonedx \
            ${GHCR_ORG}/${IMAGE}@${{ steps.build.outputs.digest }}
